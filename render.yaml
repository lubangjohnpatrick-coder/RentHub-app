services:
  - type: web
    name: gorenthive
    env: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --omit=dev && npm run build:assets
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CANON_HOST
        value: gorenthive.online
      - key: GATEWAY
        value: paymongo
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://gorenthive.online
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        sync: false

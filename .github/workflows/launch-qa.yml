name: Launch QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run qa:syntax

      - name: Asset integrity audit
        run: npm run qa:assets

      - name: Production contract audit
        run: npm run qa:contracts

      - name: Public image privacy audit
        run: npm run qa:uploads

      - name: Canonical brand identity assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f public/brand/gorenthive-mark.png
          test -f public/brand/gorenthive-wordmark.png
          test -f public/css/brand-consistency.css
          test -f public/js/brand-consistency.js
          grep -q '/brand/gorenthive-mark.png' public/manifest.webmanifest
          ! grep -q '/icons/icon-' public/manifest.webmanifest
          grep -q '/css/brand-consistency.css' public/index.html
          grep -q '/js/brand-consistency.js' public/index.html
          grep -q 'https://gorenthive.online/brand/gorenthive-mark.png' public/index.html
          grep -q "mark: '/brand/gorenthive-mark.png'" public/js/brand-consistency.js
          grep -q "wordmark: '/brand/gorenthive-wordmark.png'" public/js/brand-consistency.js
          grep -q "raw.startsWith('🐝')" public/js/brand-consistency.js
          grep -q 'gorenthive-v16-account-verification' public/service-worker.js
          grep -q '/css/brand-consistency.css' public/service-worker.js
          grep -q '/js/brand-consistency.js' public/service-worker.js
          ! grep -q 'makeIcon(' server/genicons.js
          grep -q 'canonical brand assets verified' server/genicons.js

      - name: Account verification assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/2026-09-05-account-verification-sync.sql
          test -f public/js/verification-experience.js
          grep -q "raw_user_meta_data ->> 'phone'" supabase/migrations/2026-09-05-account-verification-sync.sql
          grep -q 'confirmation_sent_at is not null' supabase/migrations/2026-09-05-account-verification-sync.sql
          grep -q 'on_auth_email_verification_sync' supabase/migrations/2026-09-05-account-verification-sync.sql
          grep -q 'confirmation_sent_at' server/auth-service.js
          grep -q 'req.authUser = authUser' server/auth-service.js
          grep -q 'expires_at: createdAt + MOBILE_TTL' server/verification-v2.js
          grep -q 'expires_at: createdAt + EMAIL_TTL' server/verification-v2.js
          grep -q 'MAX_OTP_ATTEMPTS' server/verification-v2.js
          grep -q 'sms_provider_required' server/verification-v2.js
          grep -q 'email_provider_required' server/verification-v2.js
          grep -q '/js/verification-experience.js' public/index.html
          grep -q '/js/verification-experience.js' public/service-worker.js
          grep -q 'Email verified successfully' public/js/verification-experience.js
          grep -q 'Verification code sent' public/js/verification-experience.js
          grep -q 'SMS_SENDER_WEBHOOK_URL' render.yaml
          grep -q 'EMAIL_SENDER_WEBHOOK_URL' render.yaml

      - name: Launch regression assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/2026-09-04-launch-hardening.sql
          test -f supabase/migrations/2026-09-04-location-hardening.sql
          test -f supabase/migrations/2026-09-04-private-media.sql
          test -f supabase/migrations/2026-09-04-deployment-readiness.sql
          test -f supabase/migrations/2026-09-05-profile-saved-locations.sql
          test -f supabase/migrations/2026-09-05-financial-integrity.sql
          grep -q "client_request_id" supabase/migrations/2026-09-04-deployment-readiness.sql
          grep -q "saved_locations" supabase/migrations/2026-09-05-profile-saved-locations.sql
          grep -q "profile-photos" supabase/migrations/2026-09-05-profile-saved-locations.sql
          grep -q "settle_payment_credit" supabase/migrations/2026-09-05-financial-integrity.sql
          grep -q "platform_min_fee', '0'" supabase/migrations/2026-09-05-financial-integrity.sql
          grep -q "lalamove_enabled', '0'" supabase/migrations/2026-09-05-financial-integrity.sql
          grep -q "Coordinates cannot be edited manually" server/profile-location.js
          grep -q "MAX_GPS_ACCURACY_M = 100" server/profile-location.js
          grep -q "MAX_PIN_ADJUST_M = 200" server/profile-location.js
          grep -q "key: GATEWAY" render.yaml
          grep -q "value: paymongo" render.yaml
          grep -q "GoRentHive commission is deducted from owner earnings" server/booking-v2.js
          grep -q "settle_payment_credit" server/paymongo-webhook.js
          grep -q "PAYMONGO_WEBHOOK_SECRET" server/paymongo-webhook.js
          grep -q "private://" server/upload.js
          grep -q "source !== 'gps'" server/location.js
          ! grep -q "featured,avg_rating" server/location.js
          grep -q "does not operate a delivery service" public/index.html
          grep -q "₱499" public/js/launch-ready.js
          grep -q "₱999" public/js/launch-ready.js
          grep -q "Owner commission (8%)" public/js/launch-ready.js
          grep -q "Protected payments" public/js/launch-ready.js
          ! grep -q "GATEWAY=sandbox" render.yaml

      - name: UI, mobile, payment and photography assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f public/css/experience.css
          test ! -f public/css/marketplace-preview.css
          test ! -f public/css/ux-polish.css
          test -f public/js/payment-experience.js
          grep -q "hydrateMarketplacePreview" public/js/ui-shell.js
          grep -q "REAL LISTING" public/css/experience.css
          grep -q "API.get('/listings')" public/js/ui-shell.js
          grep -q "prefers-reduced-motion" public/css/experience.css
          grep -q "@media(max-width:420px)" public/css/experience.css
          grep -q "grh-location-map" public/css/experience.css
          grep -q "grh-search-panel" public/css/experience.css
          grep -q "/css/experience.css" public/index.html
          grep -q "/js/payment-experience.js" public/index.html
          grep -q "booking_draft" public/js/payment-experience.js
          grep -q "handlePayMongoCallbackV2" public/js/payment-experience.js
          grep -q "Confirm pin & save" public/js/profile-experience.js

      - name: Security, listing privacy and readiness assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f server/readiness.js
          test -f server/request-guard.js
          test -f server/seo.js
          test -f server/listings-v2.js
          test -f server/payment-v2.js
          test -f server/upload-sanitize-test.js
          grep -q "contentSecurityPolicy" server/index.js
          grep -q "scriptSrcAttr" server/index.js
          grep -q "js.paymongo.com" server/index.js
          grep -q "api.paymongo.com" server/index.js
          grep -q "Permissions-Policy" server/index.js
          grep -q "X-Request-ID" server/index.js
          grep -q "request-guard" server/index.js
          grep -q "require('./seo')" server/index.js
          grep -q "require('./listings-v2')" server/index.js
          grep -q "require('./payment-v2')" server/index.js
          grep -q "health/readiness" server/readiness.js
          grep -q "paymentLiveKey" server/readiness.js
          grep -q "smsVerificationSender" server/readiness.js
          grep -q "emailVerificationSender" server/readiness.js
          grep -q "profile-photos" server/readiness.js
          grep -q "rental-evidence" server/readiness.js
          grep -q "stripJpegMetadata" server/upload.js
          grep -q "stripPngMetadata" server/upload.js
          grep -q "stripWebpMetadata" server/upload.js
          grep -q "listingRoute" server/seo.js
          grep -q "listing_images" server/seo.js
          ! grep -q "latitude: row.latitude" server/publicShape.js
          ! grep -q "longitude: row.longitude" server/publicShape.js
          grep -q "delivery_available: false" server/publicShape.js
          grep -q "query = query.eq('category_id', category)" server/listings-v2.js
          grep -q "This payment belongs to another account" server/payment-v2.js
          ! grep -qiE "escrow protected|provider-agnostic payment[[:space:]]*&[[:space:]]*escrow|get it delivered|platform delivery" public/index.html public/js/ui-shell.js
          grep -q "replaceText(n, 'Escrow protected', 'Protected payments')" public/js/launch-ready.js
          grep -q "Pick up or meet the owner. Record condition." public/js/launch-ready.js

      - name: Validate production route precedence
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('server/index.js', 'utf8');
          const routers = [
            "require('./location')",
            "require('./profile-location')",
            "require('./listings-v2')",
            "require('./booking-v2')",
            "require('./launch-hardening')",
            "require('./verification-v2')",
            "require('./media')",
            "require('./payment-v2')",
            "require('./financial')",
            "require('./private')"
          ].map((needle) => source.indexOf(needle));
          if (routers.some((index) => index < 0)) throw new Error('Missing launch router');
          for (let i = 1; i < routers.length; i += 1) {
            if (routers[i] <= routers[i - 1]) throw new Error('Hardened route order is incorrect');
          }
          NODE

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
